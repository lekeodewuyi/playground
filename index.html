<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scientific Calculator PWA">
    <meta name="theme-color" content="#4285f4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Scientific Calculator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="display">
                <div data-previous-operand class="previous-operand"></div>
                <div data-current-operand class="current-operand"></div>
            </div>
            <div class="buttons-grid">
                <!-- Row 1: Clear, Delete, Percentage -->
                <button class="btn clear" data-action="clear">C</button>
                <button class="btn delete" data-action="delete">DEL</button>
                <button class="btn percentage" data-action="percentage">%</button>
                <button class="btn operator" data-operation="÷">÷</button>
                
                <!-- Row 2: Functions -->
                <button class="btn function" data-function="sin">sin</button>
                <button class="btn function" data-function="cos">cos</button>
                <button class="btn function" data-function="tan">tan</button>
                <button class="btn operator" data-operation="×">×</button>
                
                <!-- Row 3: Functions -->
                <button class="btn function" data-function="log">log</button>
                <button class="btn function" data-function="ln">ln</button>
                <button class="btn function" data-function="sqrt">√</button>
                <button class="btn operator" data-operation="-">-</button>
                
                <!-- Row 4: Functions -->
                <button class="btn function" data-function="pow">x^y</button>
                <button class="btn function" data-function="exp">e^x</button>
                <button class="btn function" data-function="pi">π</button>
                <button class="btn operator" data-operation="+">+</button>
                
                <!-- Row 5: Numbers and Decimal -->
                <button class="btn number" data-number="7">7</button>
                <button class="btn number" data-number="8">8</button>
                <button class="btn number" data-number="9">9</button>
                <button class="btn equals" data-action="equals">=</button>
                
                <!-- Row 6: Numbers and Decimal -->
                <button class="btn number" data-number="4">4</button>
                <button class="btn number" data-number="5">5</button>
                <button class="btn number" data-number="6">6</button>
                <button class="btn number" data-number="0">0</button>
                
                <!-- Row 7: Numbers and Decimal -->
                <button class="btn number" data-number="1">1</button>
                <button class="btn number" data-number="2">2</button>
                <button class="btn number" data-number="3">3</button>
                <button class="btn decimal" data-action="decimal">.</button>
                
                <!-- Row 8: Special Functions -->
                <button class="btn function" data-function="factorial">x!</button>
                <button class="btn function" data-function="abs">|x|</button>
                <button class="btn function" data-function="reciprocal">1/x</button>
                <button class="btn function" data-function="square">x²</button>
            </div>
        </div>
    </div>
    
    <script src="calculator.js"></script>
</body>
</html>
